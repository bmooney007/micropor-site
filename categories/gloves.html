    .subcats a { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 0.5rem 1rem; text-decoration: none; color: #1e293b; font-weight: 500; }
    .subcats a:hover { border-color: #0f766e; color: #0f766e; }

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const filtered = products.filter(p => p.category === "gloves");
      const grid = document.getElementById("grid");
      grid.innerHTML = filtered.map(p => `
        <div class="card"><div class="card-body">
          <h3>${p.title}</h3>
          <span class="price">$${p.price}</span>
          <p><a href="../products/${p.slug}.html">View Details</a></p>
        </div></div>`).join("");
    });
  </script>
