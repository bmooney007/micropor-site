<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gloves | Micropor</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .subcats {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.75rem;
      margin: 1.5rem 0 2rem;
    }
    .subcats a {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      text-decoration: none;
      color: #1e293b;
      font-weight: 500;
      text-align: center;
    }
    .subcats a:hover {
      border-color: #800000;
      color: #800000;
      background: #fdf2f2;
    }
  </style>
</head>
<body>
  <header>
    <a href="../index.html">Micropor</a>
    <nav>
      <a href="../index.html">Home</a>
      <a href="gloves.html">Gloves</a>
      <a href="respirators.html">Respirators</a>
      <a href="cert-kits.html">CERT</a>
    </nav>
  </header>
  <div class="container">
    <h1>Gloves</h1>
    <div class="subcats">
      <a href="gloves.html">All</a>
      <a href="#">Coated</a>
      <a href="#">Cut Resistant</a>
      <a href="#">Coated Seamless</a>
      <a href="#">Disposable</a>
      <a href="#">Drivers</a>
      <a href="#">Mechanics</a>
      <a href="#">Welding</a>
      <a href="#">Work & Utility</a>
      <a href="#">Accessories</a>
      <a href="cold-weather.html">Cold Weather</a>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <footer><p>© 2026 Micropor</p></footer>
  <script src="../js/products.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const filtered = products.filter(p => p.category === "gloves");
      const grid = document.getElementById("grid");
      grid.innerHTML = filtered.map(p => `
        <div class="card"><div class="card-body">
          <h3>${p.title}</h3>
          <span class="price">$${p.price}</span>
          <p><a href="../products/${p.slug}.html">View Details</a></p>
        </div></div>`).join("");
    });
  </script>
</body>
</html>
